<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>css-visual-diff review smoke — right</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18243a;
      --muted: #53627a;
      --paper: #f2f7ff;
      --panel: #ffffff;
      --accent: #e95f2f;
      --accent-ink: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    .app {
      max-width: 920px;
      margin: 46px auto;
      padding: 36px;
      border: 1px solid #cbdaf0;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #eef5ff);
      box-shadow: 0 16px 50px rgba(24, 36, 58, 0.16);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .brand { font-weight: 850; letter-spacing: -0.02em; font-size: 24px; }
    .nav { display: flex; gap: 24px; color: var(--muted); font-size: 15px; }
    .hero {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 28px;
      align-items: center;
      min-height: 360px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 64px;
      line-height: 1.02;
      letter-spacing: -0.045em;
    }
    .lede {
      color: var(--muted);
      font-size: 20px;
      line-height: 1.45;
      margin: 0 0 30px;
    }
    .cta {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 0 30px;
      border-radius: 14px;
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 900;
      box-shadow: 0 16px 28px rgba(233, 95, 47, 0.25);
    }
    .card {
      min-height: 290px;
      padding: 32px;
      border-radius: 18px;
      border: 1px solid #bdd0ea;
      background:
        radial-gradient(circle at 24% 24%, rgba(233, 95, 47, 0.22), transparent 42%),
        #ffffff;
    }
    .metric {
      margin-top: 118px;
      padding: 22px;
      border-radius: 12px;
      background: #fff0e9;
      color: #b2421c;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main id="app" class="app">
    <header class="topbar">
      <div class="brand">ReviewSmoke</div>
      <nav class="nav" aria-label="Smoke navigation"><span>Overview</span><span>Details</span><span>Launch</span></nav>
    </header>
    <section class="hero">
      <div>
        <div class="eyebrow">Candidate</div>
        <h1>Compare visual review cards.</h1>
        <p class="lede">This right page intentionally changes spacing, colors, radius, typography, and button text for the comparison UI.</p>
        <button class="cta">Start review now</button>
      </div>
      <aside class="card">
        <strong>Quality score</strong>
        <div class="metric">81% ready</div>
      </aside>
    </section>
  </main>
</body>
</html>
