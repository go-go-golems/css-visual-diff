<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>css-visual-diff review smoke — left</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #23201a;
      --muted: #6a6258;
      --paper: #fbf6ec;
      --panel: #fffaf1;
      --accent: #2f6fed;
      --accent-ink: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    .app {
      max-width: 920px;
      margin: 32px auto;
      padding: 28px;
      border: 1px solid #e2d6c4;
      border-radius: 28px;
      background: linear-gradient(180deg, #fffaf1, #f7efe1);
      box-shadow: 0 24px 70px rgba(35, 32, 26, 0.10);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 44px;
    }
    .brand { font-weight: 850; letter-spacing: -0.045em; font-size: 22px; }
    .nav { display: flex; gap: 18px; color: var(--muted); font-size: 14px; }
    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 36px;
      align-items: center;
      min-height: 330px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 58px;
      line-height: 0.96;
      letter-spacing: -0.065em;
    }
    .lede {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
      margin: 0 0 26px;
    }
    .cta {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      border-radius: 999px;
      border: 0;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 800;
      box-shadow: 0 12px 24px rgba(47, 111, 237, 0.24);
    }
    .card {
      min-height: 250px;
      padding: 26px;
      border-radius: 26px;
      border: 1px solid #ded2bf;
      background:
        radial-gradient(circle at 70% 20%, rgba(47, 111, 237, 0.18), transparent 38%),
        #fffdf8;
    }
    .metric {
      margin-top: 92px;
      padding: 18px;
      border-radius: 18px;
      background: #edf3ff;
      color: #254f9b;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main id="app" class="app">
    <header class="topbar">
      <div class="brand">ReviewSmoke</div>
      <nav class="nav" aria-label="Smoke navigation"><span>Overview</span><span>Details</span><span>Ship</span></nav>
    </header>
    <section class="hero">
      <div>
        <div class="eyebrow">Baseline</div>
        <h1>Compare visual review cards.</h1>
        <p class="lede">This left page is the baseline for testing screenshots, CSS diffs, review pins, notes, and LLM handoff export.</p>
        <button class="cta">Start review</button>
      </div>
      <aside class="card">
        <strong>Quality score</strong>
        <div class="metric">92% ready</div>
      </aside>
    </section>
  </main>
</body>
</html>
